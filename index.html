<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compute → VCL → GitHub Pages</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f4f8;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 2rem 3rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
        }
        h1 { color: #1a1a2e; margin-bottom: 0.5rem; }
        .chain {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }
        .node {
            background: #e8f4fd;
            border: 2px solid #2196F3;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .arrow { font-size: 1.5rem; color: #666; }
        .origin { background: #e8fde8; border-color: #4CAF50; }
        .compute { background: #fff3e0; border-color: #FF9800; }
        .meta { color: #666; font-size: 0.85rem; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Multi-Layer Edge Delivery</h1>
        <p>This page was served through the full Fastly stack:</p>
        <div class="chain">
            <span class="node compute">Compute@Edge</span>
            <span class="arrow">→</span>
            <span class="node">VCL Service</span>
            <span class="arrow">→</span>
            <span class="node origin">GitHub Pages</span>
        </div>
        <p class="meta">
            Origin: <strong>abhalimee.github.io/service_1_test/</strong><br>
            Served via: <strong>evidently-rich-pug.edgecompute.app</strong>
        </p>
    </div>
</body>
</html>
