<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge Delivery Demo</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f0f4f8; }
        .card { background: white; border-radius: 12px; padding: 2rem 3rem; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 600px; }
        h1 { margin-bottom: 0.5rem; }
        .path { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin: 1.5rem 0; flex-wrap: wrap; }
        .node { padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; font-size: 0.95rem; }
        .compute { background: #fff3e0; border: 2px solid #FF9800; }
        .vcl { background: #e8f4fd; border: 2px solid #2196F3; }
        .origin { background: #e8fde8; border: 2px solid #4CAF50; }
        .arrow { font-size: 1.5rem; color: #666; }
        .info { color: #666; font-size: 0.85rem; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Edge Delivery Demo</h1>
        <p id="description">Detecting request path...</p>
        <div class="path" id="path-display"></div>
        <p class="info" id="info"></p>
    </div>
    <script>
        const hostname = window.location.hostname;
        const pathEl = document.getElementById('path-display');
        const descEl = document.getElementById('description');
        const infoEl = document.getElementById('info');

        function node(label, cls) {
            return `<span class="node ${cls}">${label}</span>`;
        }
        const arrow = '<span class="arrow">→</span>';

        if (hostname.includes('edgecompute.app')) {
            descEl.textContent = 'Request routed through Compute, VCL, then Origin:';
            pathEl.innerHTML = node('🟠 Compute', 'compute') + arrow + node('🔵 VCL', 'vcl') + arrow + node('🟢 GitHub Pages', 'origin');
            infoEl.textContent = 'evidently-rich-pug.edgecompute.app → ahlimee-service-1.global.ssl.fastly.net → abhalimee.github.io';
        } else if (hostname.includes('fastly.net')) {
            descEl.textContent = 'Request routed through VCL, then Origin:';
            pathEl.innerHTML = node('🔵 VCL', 'vcl') + arrow + node('🟢 GitHub Pages', 'origin');
            infoEl.textContent = 'ahlimee-service-1.global.ssl.fastly.net → abhalimee.github.io';
        } else {
            descEl.textContent = 'Request served directly from Origin:';
            pathEl.innerHTML = node('🟢 GitHub Pages', 'origin');
            infoEl.textContent = 'abhalimee.github.io/service_1_test/';
        }
    </script>
</body>
</html>
